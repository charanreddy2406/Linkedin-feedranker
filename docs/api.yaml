openapi: 3.0.3
info:
  title: Feed Ranking Service
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: ok
  /feed:
    get:
      summary: Personalized ranked feed for a user
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: integer } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A ranked feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        post_id:   { type: integer }
                        author_id: { type: integer }
                        text:      { type: string }
                        score:     { type: number }
  /events/engagement:
    post:
      summary: Record an engagement event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngagementEvent" }
      responses:
        "202": { description: accepted and published }
        "400": { description: invalid payload }
        "503": { description: event bus unavailable }
components:
  schemas:
    EngagementEvent:
      type: object
      required: [schema_version, event_id, user_id, post_id, event_type, ts]
      properties:
        schema_version: { type: integer, example: 1 }
        event_id:       { type: string, format: uuid }
        user_id:        { type: integer }
        post_id:        { type: integer }
        event_type:     { type: string, enum: [like, comment, follow] }
        ts:             { type: string, format: date-time }
